{% extends "user_dashboard/base.html" %}
{% block title %}Request Blood{% endblock %}{% block crumb %}Request Blood{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Blood Request Form</h1><p>Submit a request for admin review and donor matching.</p></div></div>
<form method="post" class="form-card">{% csrf_token %}
  <div class="form-grid">
    <label>Patient Name *<input name="patient_name" required placeholder="Enter patient name"></label>
    <label>Blood Group *<select name="blood_group" required><option value="">Select Blood Group</option>{% for value,label in groups %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
    <label>Hospital Name *<input name="hospital_name" required placeholder="Enter hospital name"></label>
    <label>City *<input name="city" required placeholder="Enter city"></label>
    <label>Urgency *<select name="urgency"><option>Normal</option><option>Urgent</option><option>Critical</option></select></label>
    <label class="wide">Additional Details<textarea name="additional_details" rows="5" placeholder="Add any useful information..."></textarea></label>
  </div>
  <button class="btn primary" type="submit">Submit Request</button>
</form>
{% endblock %}
