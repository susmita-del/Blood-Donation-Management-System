{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Blood Request</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    .container { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; }
    h2 { margin-bottom: 5px; }
    .breadcrumb { color: gray; font-size: 14px; margin-bottom: 20px; }
    .form-row { display: flex; gap: 30px; }
    .col { flex: 1; }
    label { font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 18px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .btn { background: #8B0000; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 15px; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 5px; margin-bottom: 20px; }
  </style>
</head>
<body>
    {% include 'header.html' %}
<div class="container">
  <h2>Blood Request Form</h2>
  <div class="breadcrumb">Home / Request Blood</div>

  {% if success %}
    <div class="success">{{ success }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-row">
      <!-- Left Side -->
      <div class="col">
        <label>Patient Name</label>
        <input type="text" name="patient_name" placeholder="Enter name" required>

        <label>Hospital Name</label>
        <input type="text" name="hospital_name" placeholder="Enter hospital name" required>

        <label>Urgency</label>
        <select name="urgency" required>
          <option value="">Select Urgency</option>
          <option>High - Need within 24 hours</option>
          <option>Medium - Need within 2-3 days</option>
          <option>Low</option>
        </select>

        <button type="submit" class="btn">Submit Request</button>
      </div>

      <!-- Right Side -->
      <div class="col">
        <label>Blood Group</label>
        <select name="blood_group" required>
          <option value="">Select Blood Group</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
        </select>

        <label>City</label>
        <input type="text" name="city" placeholder="Enter city" required>

        <label>Additional Details</label>
        <textarea name="details" rows="5" placeholder="Write additional details..."></textarea>
      </div>
    </div>
  </form>
</div>
 {% include 'footer.html' %}
</body>
</html>
